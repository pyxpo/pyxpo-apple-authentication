[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-apple-authentication"
dynamic = ["version"]
description = "Sign in with Apple for pyxpo apps (AuthenticationServices)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "ios", "apple", "sign-in-with-apple", "authentication", "id-token"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a9,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo-apple-authentication"
Documentation = "https://github.com/pyxpo/pyxpo-apple-authentication/blob/main/README.md"
Changelog = "https://github.com/pyxpo/pyxpo-apple-authentication/blob/main/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo-apple-authentication"
Issues = "https://github.com/pyxpo/pyxpo-apple-authentication/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
apple-authentication = "pyxpo_apple_authentication"

[tool.setuptools]
packages = ["pyxpo_apple_authentication"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_apple_authentication.__version__" }

[tool.setuptools.package-data]
pyxpo_apple_authentication = ["pyxpo-module.json", "py.typed", "ios/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
